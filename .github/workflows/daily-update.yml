name: Daily Data Update

on:
  schedule:
    # 每天北京时间 16:30 (UTC 08:30) 执行，A 股收盘后
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install akshare --quiet

      - name: Fetch latest stock data (2-year window)
        run: |
          python update_data.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate comparison report
        run: |
          node gen_report.js
          cp turtle_report.html web_tool/turtle_report.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web_tool/js/data.js turtle_report.html web_tool/turtle_report.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update stock data & report $(date -u +%Y-%m-%d)"
            git push
          fi
